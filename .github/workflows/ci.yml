name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Installer les dépendances (lockfile strict)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatage (ruff format)
        run: uv run ruff format --check .

      - name: Typage (mypy strict)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest
