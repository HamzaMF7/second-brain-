name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Installer les dépendances (lockfile strict)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatage (ruff format)
        run: uv run ruff format --check .

      - name: Typage (mypy strict)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest
