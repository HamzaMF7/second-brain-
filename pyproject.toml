[project]
name = "second-brain"
version = "0.0.1"
description = "Mémoire personnelle locale interrogeable en langage naturel"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "typer>=0.27.3",
]

[project.scripts]
second-brain = "second_brain.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]  # ne pas reformater les exemples de code de la documentation

[tool.ruff.lint]
select = [
  "E", "W",  # style
  "F",       # erreurs réelles (import inutilisé, nom non défini)
  "I",       # tri des imports
  "UP",      # syntaxe moderne (list[str] plutôt que List[str])
  "B",       # pièges classiques (argument par défaut mutable…)
  "SIM",     # simplifications
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# PyMuPDF n'est que partiellement typé : on tolère les appels à ses fonctions non annotées.
untyped_calls_exclude = ["pymupdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pypdf>=6.20.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
